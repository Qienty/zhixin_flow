<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>smoke</title></head>
<body>
<pre id="out">running</pre>
<script>
const log = [];
function ok(name, cond, extra) {
  log.push((cond ? "PASS  " : "FAIL  ") + name + (extra ? "  :: " + extra : ""));
  document.getElementById("out").textContent = log.join("\n");
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const end = Date.now() + (ms || 4000);
  while (Date.now() < end) {
    try { if (fn()) return true; } catch (e) {}
    await wait(50);
  }
  return false;
}
window.onerror = (m) => ok("harness error", false, m);

(async function () {
try {
await fetch("/api/demo/seed?reset=1&tz_offset=480", { method: "POST" });

  // iframe 必须在种完数据之后再建，并且等它自己的 load 事件，
  // 否则拿到的是上一份文档，后面所有点击都打在已经脱离的节点上
  const f = document.createElement("iframe");
  f.style.cssText = "width:420px;height:760px;border:0";
  await new Promise((resolve) => {
    f.onload = resolve;
    f.src = "./index.html?x=" + Date.now();
    document.body.appendChild(f);
  });
  const W = f.contentWindow, D = f.contentDocument;
  W.onerror = (m) => ok("app error", false, m);

  // 1. 首页渲染
  ok("首页出现情绪瓦片", await until(() => D.querySelectorAll(".emo-tile").length === 7));
  ok("首页出现记录行", await until(() => D.querySelectorAll(".entry").length > 0),
     "n=" + D.querySelectorAll(".entry").length);

  // 2. 主题色跟随手动主题
  const bar = () => D.querySelector('meta[name="theme-color"]').getAttribute("content");
  const before = bar();
  D.querySelector('[data-act="theme"]').click();
  await wait(120);
  D.querySelector('[data-act="theme"]').click();
  await wait(120);
  const themeAttr = D.documentElement.dataset.theme;
  ok("theme-color 与主题一致", bar() === (themeAttr === "dark" ? "#141815" : "#F6F3EC"),
     themeAttr + " / " + bar() + " (was " + before + ")");

  // 3. 双击情绪瓦片只建一条记录
  const n0 = (await (await fetch("/api/entries?limit=1")).json()).total;
  const tile = D.querySelector('.emo-tile[data-emotion="anxiety"]');
  tile.click();
  tile.click();
  tile.click();
  await until(() => !D.getElementById("overlay").hidden);
  await wait(900);
  const n1 = (await (await fetch("/api/entries?limit=1")).json()).total;
  ok("连点三次只建一条记录", n1 === n0 + 1, n0 + " -> " + n1);

  // 4. 浮层可访问性
  const ov = D.getElementById("overlay");
  ok("浮层是 dialog", ov.getAttribute("role") === "dialog");
  ok("浮层有可访问名称", !!ov.getAttribute("aria-label"), ov.getAttribute("aria-label"));

  // 5. 引导进度条不带 transition
  const live = ov.querySelector(".progress-line.live");
  ok("引导进度条标了 live", !!live);
  if (live) {
    const td = W.getComputedStyle(live.querySelector("i")).transitionDuration;
    ok("live 进度条无 transition", td === "0s" || td === "0.001ms", td);
  }

  // 6. 走完引导
  for (let i = 0; i < 8; i++) {
    const next = ov.querySelector('[data-act="iv-next"]');
    if (!next) break;
 next.click();
    await wait(120);
  }
  ok("走到结语页", await until(() => !!ov.querySelector('[data-act="note"]')));

  // 7. Esc 关闭并回到列表
  D.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  ok("Esc 关闭浮层", await until(() => ov.hidden));
  ok("role 清掉了", !ov.getAttribute("role"));

  // 8. 记录页筛选
  D.querySelector('.tab[data-view="log"]').click();
  ok("进入记录页", await until(() => !!D.getElementById("log-body")));
  const total = D.getElementById("log-count").textContent;
  D.querySelector('.chip[data-act="filter"][data-emotion="anger"]').click();
  await wait(150);
  ok("筛选后计数变化", D.getElementById("log-count").textContent !== total,
     total + " -> " + D.getElementById("log-count").textContent);
  D.querySelector('.chip[data-act="sort"][data-sort="time"]').click();
  await wait(150);
  ok("按时间排序出现日期分隔", D.querySelectorAll(".day-head").length > 0);

  // 9. 总结页
  D.querySelector('.tab[data-view="insights"]').click();
  ok("总结页出统计", await until(() => !!D.querySelector(".stat-value")));
  const firstCount = D.querySelector(".stat-value").textContent;
  ok("总结页出走势图", D.querySelectorAll(".spark i").length > 0);

  // 10. 新记录会让总结失效重算
  await fetch("/api/entries", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ emotion: "anger", severity: 5, cause: "smoke", tz_offset: 480 }),
  });
  W.history.pushState({ view: "now" }, "", "#now");
  D.querySelector('.tab[data-view="now"]').click();
  await wait(200);
  D.querySelector('.tab[data-view="log"]').click();
  await wait(200);
  // 用应用自己的入口刷一遍记录，再回总结页
  D.querySelector('.tab[data-view="insights"]').click();
  await wait(600);
  ok("总结页可用（失效后重载不报错）",
     await until(() => !!D.querySelector(".stat-value")), "entries=" + firstCount);

  // 11. 切换语言
  D.querySelector('.tab[data-view="me"]').click();
  ok("进入我的页", await until(() => !!D.querySelector('[data-act="lang"]')));
  D.querySelector('.chip[data-act="lang"][data-lang="en"]').click();
  ok("切到英文", await until(() => D.documentElement.lang === "en"));
  ok("英文下标题也换了", /Tether · Log/.test(D.title), D.title);
  ok("英文下记录页正常", await until(() => {
    D.querySelector('.tab[data-view="log"]').click();
    return !!D.getElementById("log-body");
  }));
  D.querySelector('.tab[data-view="me"]').click();
  await until(() => !!D.querySelector('[data-act="lang"]'));
  D.querySelector('.chip[data-act="lang"][data-lang="zh"]').click();
  await until(() => D.documentElement.lang === "zh-CN");

  // 12. 同一 tab 再点一次回顶部；切走再回来则恢复各自的滚动位置
  D.querySelector('.tab[data-view="log"]').click();
  await wait(200);
  W.scrollTo(0, 300);
  await wait(80);
  D.querySelector('.tab[data-view="me"]').click();
  await wait(200);
  D.querySelector('.tab[data-view="log"]').click();
  await wait(200);
  ok("切走再回来恢复滚动位置", Math.abs(W.scrollY - 300) < 40, "scrollY=" + W.scrollY);
  // 无头环境里 smooth 滚动不会真的动，所以直接看有没有发出回顶部的请求
  const calls = [];
  const realScrollTo = W.scrollTo;
  W.scrollTo = function (arg) {
    if (arg && typeof arg === "object") calls.push({ top: arg.top, behavior: arg.behavior });
  return realScrollTo.apply(W, arguments);
  };
  D.querySelector('.tab[data-view="log"]').click();
  await wait(300);
  ok("再点当前 tab 请求回顶部", calls.some((c) => c && c.top === 0), JSON.stringify(calls));
  W.scrollTo = realScrollTo;

  log.push("DONE");
} catch (e) {
  ok("harness threw", false, e && e.message);
}
document.getElementById("out").textContent = log.join("\n");
})();
</script>
</body></html>
