<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EC" />
  <meta name="description" content="Tether — 情绪记录与自我调节工具。低摩擦记录、按严重程度排序、峰值时刻的 30 秒引导。" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tether" />
  <title>Tether · 情绪记录与自我调节</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-180.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233E5B4B'/%3E%3Cpath d='M16 7v13' stroke='%23F6F3EC' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='23' r='3.2' fill='%23F6F3EC'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/app.css" />
  <script src="./js/theme-init.js"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#now" data-act="nav" data-view="now" aria-label="Tether">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="16" cy="24" r="3.4" fill="currentColor" />
        </svg>
        <span class="brand-wordmark"><span class="brand-name">Tether</span><span class="brand-caption" data-i18n="brand.caption">给情绪一个落点</span></span>
      </a>
      <div class="topbar-right">
        <span class="plan-chip" id="plan-chip" hidden></span>
        <button class="icon-btn" data-act="refresh-data" data-i18n-aria="common.refresh" aria-label="刷新数据" title="刷新数据">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-3-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" data-act="theme" id="theme-btn" aria-label="切换深浅色" title="切换深浅色"></button>
        <button class="icon-btn" data-act="open-crisis" data-i18n-aria="crisis.title" aria-label="危机资源" title="危机资源">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7.5 3c0 5.3-7.5 10-7.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" data-i18n-aria="nav.label" aria-label="主导航">
    <button class="tab" data-act="nav" data-view="now" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      <span data-i18n="nav.now">现在</span>
    </button>
    <button class="tab" data-act="nav" data-view="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10m0 5C5 15 4 10 5 5c5 0 8 3 7 8m0 4c6 0 8-4 7-8-4 0-7 2-7 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="nav.practice">练习</span>
    </button>
    <button class="tab" data-act="nav" data-view="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="nav.log">记录</span>
    </button>
    <button class="tab" data-act="nav" data-view="insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9M9.3 18V5M14.7 18v-6M20 18v-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="nav.insights">总结</span>
    </button>
    <button class="tab" data-act="nav" data-view="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 19.5c.8-3.2 3.3-5 6.5-5s5.7 1.8 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="nav.me">我的</span>
    </button>
  </nav>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Tether 需要 JavaScript 才能运行。</p></noscript>
  <script type="module" src="./js/app.js"></script>
  <script src="./js/register-sw.js"></script>
</body>
</html>
